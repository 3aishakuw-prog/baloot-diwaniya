<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22150e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بلوت">
<meta name="description" content="بلوت الديوانية — العب بلوت أوفلاين ضد الكمبيوتر أو أونلاين مع أصحابك">
<title>بلوت الديوانية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<!--CSS-->
<link rel="stylesheet" href="css/app.css?v=e88401af">
<!--/CSS-->
</head>
<body>
<div id="app" class="app">

  <section id="scr-splash" class="screen active" aria-label="تحميل">
    <div class="brand">
      <div id="splash-emblem"></div>
      <h1>بلوت</h1>
      <div class="sub">الديوانية</div>
    </div>
    <div class="loader" aria-hidden="true"></div>
  </section>

  <section id="scr-login" class="screen" aria-label="تسجيل الدخول">
    <div class="band"></div>
    <div class="scroll">
      <div class="login-wrap">
        <div class="brand">
          <div id="login-emblem"></div>
          <h1>بلوت</h1>
          <div class="sub">الديوانية</div>
          <p id="login-tag">حكم وصن ومشاريع — أوفلاين وأونلاين</p>
        </div>
        <div class="panel" id="login-panel"></div>
      </div>
    </div>
  </section>

  <section id="scr-home" class="screen" aria-label="الرئيسية">
    <div class="band"></div>
    <div class="scroll">
      <div class="home-top" id="home-top"></div>
      <div class="home-brand"><h1>بلوت</h1></div>
      <div class="stat-line" id="home-stats"></div>
      <div class="modes" id="home-modes"></div>
      <div class="home-row" id="home-row"></div>
    </div>
  </section>

  <section id="scr-lobby" class="screen" aria-label="أونلاين">
    <div class="band thin"></div>
    <div class="lobby-head">
      <button class="icon-btn" id="lobby-back" aria-label="رجوع">➜</button>
      <h2 id="lobby-title">أونلاين</h2>
    </div>
    <div class="scroll" id="lobby-body"></div>
    <div class="lobby-foot" id="lobby-foot"></div>
  </section>

  <section id="scr-game" class="screen" aria-label="الطاولة">
    <header class="gbar">
      <button class="icon-btn" id="btn-menu" aria-label="القائمة">☰</button>
      <div class="score-pill">
        <button id="score-btn" aria-label="الصكة">
          <span class="side us"><small>لنا</small><b id="sc-us">0</b></span>
          <span class="mid"><span>الجولة <b id="sc-round">1</b></span><span>من <b id="sc-target">152</b></span></span>
          <span class="side them"><small>لهم</small><b id="sc-them">0</b></span>
        </button>
      </div>
      <button class="icon-btn" id="btn-chat" aria-label="سوالف">💬</button>
      <button class="icon-btn" id="btn-sound" aria-label="الصوت">🔊</button>
    </header>
    <div class="table" id="table">
      <div class="rug">
        <div class="rug-band top"></div>
        <div class="rug-band bottom"></div>
        <div class="rug-side left"></div>
        <div class="rug-side right"></div>
      </div>
      <div class="rug-medallion"></div>
      <div class="contract-chip" id="contract-chip"></div>
      <button class="trick-count" id="trick-count" aria-label="آخر أكلة"></button>
      <div class="cards" id="cards"></div>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
</div>
<!--JS-->
<script src="shared/engine.js?v=e88401af"></script>
<script src="shared/bot.js?v=e88401af"></script>
<script src="shared/host.js?v=e88401af"></script>
<script src="js/cards.js?v=e88401af"></script>
<script src="js/sound.js?v=e88401af"></script>
<script src="js/net.js?v=e88401af"></script>
<script src="js/ui.js?v=e88401af"></script>
<script src="js/table.js?v=e88401af"></script>
<script src="js/app.js?v=e88401af"></script>
<!--/JS-->
</body>
</html>
